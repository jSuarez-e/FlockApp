<!--
  @sdd
  [Objetivo]: Estructura HTML para medidor visual de fortaleza de contraseña.
  [I/O - Reusabilidad]: Consume Signal password() y Signals derivados score(), text(), cssClass().
  [Edge Cases - UI]: Oculta el medidor si el score es 0; barras adaptables con flexbox.
-->
@if (score() > 0) {
  <div class="password-meter">
    <div class="password-meter__bars">
      <div class="password-meter__bar" [ngClass]="score() >= 1 ? 'password-meter__bar--' + cssClass() : ''"></div>
      <div class="password-meter__bar" [ngClass]="score() >= 2 ? 'password-meter__bar--' + cssClass() : ''"></div>
      <div class="password-meter__bar" [ngClass]="score() >= 3 ? 'password-meter__bar--' + cssClass() : ''"></div>
      <div class="password-meter__bar" [ngClass]="score() >= 4 ? 'password-meter__bar--' + cssClass() : ''"></div>
    </div>
    <div class="password-meter__text" [ngClass]="'password-meter__text--' + cssClass()">
      Nivel de seguridad: <strong>{{ text() }}</strong>
    </div>
  </div>
}
