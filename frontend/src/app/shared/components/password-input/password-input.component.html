<div class="password-input">
  <label class="password-input__label">{{ label() }}</label>
  <div
    class="password-input__wrapper"
    [class.password-input__wrapper--invalid]="isTouched() && isInvalid()"
  >
    <ion-icon class="password-input__icon" name="lock-closed-outline"></ion-icon>
    <input
      [(ngModel)]="value"
      (blur)="isTouched.set(true)"
      [type]="showPassword() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      autocomplete="new-password"
      class="password-input__control"
    />
    <ion-button
      class="password-input__toggle"
      fill="clear"
      slot="end"
      (click)="toggleVisibility()"
      color="medium"
    >
      <ion-icon
        [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"
      ></ion-icon>
    </ion-button>
  </div>
  @if (showMeter()) {
    <app-password-meter
      [password]="value()"
    ></app-password-meter>
  }
</div>
