<div class="auth-input">
  @if (label()) {
    <label class="auth-input__label">{{ label() }}</label>
  }
  <div
    class="auth-input__wrapper"
    [class.auth-input__wrapper--invalid]="isTouched() && isInvalid()"
  >
    <ion-icon class="auth-input__icon" name="lock-closed-outline"></ion-icon>
    <input
      [(ngModel)]="value"
      (blur)="isTouched.set(true)"
      [type]="showPassword() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      autocomplete="new-password"
      class="auth-input__control"
    />
    <button
      type="button"
      class="auth-input__toggle-btn"
      (click)="toggleVisibility()"
      [title]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
      [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
    >
      <ion-icon
        [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"
      ></ion-icon>
    </button>
  </div>
  @if (showMeter()) {
    <app-password-meter
      [password]="value()"
    ></app-password-meter>
  }
</div>
