<ion-content class="auth-content">
  <div class="auth-shell">
    <app-brand-header></app-brand-header>

    <div class="ibirds-card">
      <app-auth-card-header
        title="¡Bienvenido!"
        subtitle="Tu App para rutas, avistamientos y sitios en Colombia."
      >
      </app-auth-card-header>

      <div class="card-body ion-padding">
        <form
          (ngSubmit)="onLogin()"
          class="auth-form"
          novalidate
        >
          <app-auth-input
            label="Usuario o correo"
            icon="person-outline"
            placeholder="ej: pajarero o tu@email.com"
            [(value)]="identifier"
            [isInvalid]="isFormSubmitted() && !isIdentifierValid()"
          >
          </app-auth-input>

          <app-password-input
            label="Contraseña"
            [(value)]="password"
            [isInvalid]="isFormSubmitted() && !isPasswordValid()"
          >
          </app-password-input>

          <div class="options-row">
            <ion-checkbox [(ngModel)]="rememberMe" name="rememberMe" labelPlacement="end">
              Recordar mi sesión
            </ion-checkbox>
          </div>

          <ion-button
            expand="block"
            class="primary-btn"
            type="submit"
            [disabled]="isFormSubmitted() && !isFormValid()"
          >
            INICIAR SESIÓN
          </ion-button>

          <div class="ion-text-center">
            <ion-button
              fill="clear"
              class="recovery-link"
              [routerLink]="['/auth/forgot-password']"
            >
              ¿Olvidaste tu contraseña?
            </ion-button>
          </div>
        </form>
      </div>
    </div>

    <div class="registration-footer ion-text-center ion-margin-top">
      <p class="footer-question">¿Aún no eres parte?</p>
      <a [routerLink]="['/auth/register']" class="footer-link"
        >Crea tu cuenta aquí</a
      >
    </div>
  </div>
</ion-content>
