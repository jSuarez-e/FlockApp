<ion-content class="auth-content">
  <div class="auth-shell">
    <app-brand-header></app-brand-header>

    <div class="ibirds-card">
      <app-auth-card-header
        title="¡Crea tu Cuenta!"
        subtitle="Accede a un nuevo mundo y conoce acerca del Aviturismo en Colombia"
      >
      </app-auth-card-header>

      <div class="card-body ion-padding">
        <form
          (ngSubmit)="onRegister()"
          class="auth-form"
          novalidate
        >
          <div class="auth-input">
            <label class="auth-input__label">Tipo de Usuario</label>
            <div class="auth-input__wrapper">
              <ion-icon class="auth-input__icon" name="people-outline"></ion-icon>
              <ion-select
                [(ngModel)]="selectedRole"
                name="role"
                (ionChange)="onRoleChange($event)"
                interface="popover"
                class="auth-input__control"
              >
                <ion-select-option value="PAJARERO"
                  >Pajarero / Observador</ion-select-option
                >
                <ion-select-option value="PROVEEDOR"
                  >Proveedor de Servicios</ion-select-option
                >
                <ion-select-option value="BOTH">Ambos</ion-select-option>
              </ion-select>
            </div>
          </div>

          <div class="form-row">
            <app-auth-input
              label="Nombre"
              placeholder="Ej. Juan"
              [(value)]="firstName"
              [isInvalid]="isFormSubmitted() && !isFirstNameValid()"
            >
            </app-auth-input>

            <app-auth-input
              label="Apellido"
              placeholder="Ej. Pérez"
              [(value)]="lastName"
              [isInvalid]="isFormSubmitted() && !isLastNameValid()"
            >
            </app-auth-input>
          </div>

          <app-auth-input
            label="Nombre de Usuario"
            icon="person-outline"
            placeholder="juanperez99"
            [(value)]="username"
            [isInvalid]="isFormSubmitted() && !isUsernameValid()"
          >
          </app-auth-input>

          <app-auth-input
            label="Correo Electrónico"
            icon="mail-outline"
            type="email"
            placeholder="juan@correo.com"
            [(value)]="email"
            [isInvalid]="isFormSubmitted() && !isEmailValid()"
          >
          </app-auth-input>

          <app-password-input
            label="Contraseña"
            [showMeter]="true"
            [(value)]="password"
            [isInvalid]="isFormSubmitted() && !isPasswordValid()"
          >
          </app-password-input>

          @if (selectedRole() === 'PROVEEDOR' || selectedRole() === 'BOTH') {
          <div class="provider-section">
            <div class="section-badge">Datos de Negocio</div>
            <app-auth-input
              label="Nombre del Negocio"
              icon="briefcase-outline"
              placeholder="Ej. EcoTours"
              [(value)]="businessName"
              [isInvalid]="isFormSubmitted() && !isBusinessNameValid()"
            >
            </app-auth-input>

            <app-auth-input
              label="RNT"
              icon="document-text-outline"
              placeholder="Ej. 123456"
              [(value)]="rnt"
              [isInvalid]="isFormSubmitted() && !isRntValid()"
            >
            </app-auth-input>
          </div>
          }

          <div class="legal-note">
            Al registrarte, aceptas nuestros
            <a (click)="openTerms()">Términos y Políticas</a>.
          </div>

          <ion-button
            expand="block"
            type="submit"
            class="primary-btn"
            [disabled]="isFormSubmitted() && !isFormValid()"
          >
            Registrarme ahora
          </ion-button>
        </form>
      </div>
    </div>

    <div class="registration-footer ion-text-center ion-margin-top">
      <p class="footer-question">¿Ya tienes cuenta?</p>
      <a routerLink="/auth/login" class="footer-link">Inicia sesión</a>
    </div>
  </div>
</ion-content>
