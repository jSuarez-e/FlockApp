
<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-shell">
    <app-brand-header></app-brand-header>

    <div class="ibirds-card">
      @switch (currentStep()) { @case ('email') {
      <app-auth-card-header
        title="¡Recupera tu Cuenta!"
        subtitle="En unos cuantos pasos recuperarás tu acceso"
      >
      </app-auth-card-header>

      <div class="card-body ion-padding">
        <form
          (ngSubmit)="onRequestCode()"
          class="auth-form"
          novalidate
        >
          <app-auth-input
            label="Correo electrónico"
            icon="mail-outline"
            type="email"
            placeholder="ejemplo@correo.com"
            [(value)]="userEmail"
            [isInvalid]="isFormSubmitted() && !isEmailValid()"
          >
          </app-auth-input>

          <ion-button
            expand="block"
            type="submit"
            class="primary-btn"
            [disabled]="isFormSubmitted() && !isEmailValid()"
          >
            SOLICITAR CÓDIGO
          </ion-button>

          <div class="ion-text-center">
            <ion-button
              fill="clear"
              class="back-link"
              [routerLink]="['/auth/login']"
            >
              Volver al inicio
            </ion-button>
          </div>
        </form>
      </div>
      } @case ('otp') {
      <app-auth-card-header
        title="¡Verificación!"
        [subtitle]="'Ingresa el Código enviado a: ' + userEmail()"
      >
      </app-auth-card-header>

      <div class="card-body ion-padding">
        <div class="auth-form">
          <app-otp-input
            (codeCompleted)="onOtpCodeCompleted($event)"
          ></app-otp-input>

          <ion-button
            expand="block"
            class="primary-btn"
            (click)="onVerifyOtp()"
            [disabled]="otpValue().length < 6"
          >
            VERIFICAR CÓDIGO
          </ion-button>

          <div class="ion-text-center">
            <ion-button fill="clear" class="back-link" (click)="onResendCode()">
              Solicitar otro código
            </ion-button>
          </div>
        </div>
      </div>
      } @case ('reset') {
      <app-auth-card-header
        title="¡Nueva Clave!"
        subtitle="Restablece tu acceso de forma segura"
      >
      </app-auth-card-header>

      <div class="card-body ion-padding">
        <form
          (ngSubmit)="onResetPassword()"
          class="auth-form"
          novalidate
        >
          <app-password-input
            label="Nueva Contraseña"
            placeholder="Mínimo 8 caracteres"
            [showMeter]="true"
            [(value)]="password"
            [isInvalid]="isFormSubmitted() && !isPasswordValid()"
          >
          </app-password-input>

          <app-password-input
            label="Confirmar Contraseña"
            placeholder="Repite tu contraseña"
            [(value)]="confirmPassword"
            [isInvalid]="isFormSubmitted() && !passwordsMatch()"
          >
          </app-password-input>

          <ion-button
            expand="block"
            type="submit"
            class="primary-btn"
            [disabled]="isFormSubmitted() && !isResetFormValid()"
          >
            ACTUALIZAR CONTRASEÑA
          </ion-button>
        </form>
      </div>
      } }
    </div>
  </div>
</ion-content>
