<ion-header class="ion-no-border flock-modal-header">
  <ion-toolbar>
    <ion-title>Actualizar Contraseña</ion-title>
    <ion-buttons slot="end">
      <button type="button" (click)="dismiss()" class="flock-header-pill-btn" aria-label="Cerrar modal">
        <ion-icon name="close-outline"></ion-icon>
        <span>Cerrar</span>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-shell">
    <div class="ibirds-card">
      <app-auth-card-header
        title="Actualizar Contraseña"
        subtitle="Asegura tu cuenta con una combinación fuerte de caracteres."
      >
      </app-auth-card-header>

      <div class="card-body ion-padding">
        <form
          (ngSubmit)="onSubmit()"
          class="auth-form-profile"
          novalidate
        >
          <app-password-input
            label="Contraseña Actual"
            placeholder="Ingresa tu clave actual"
            [(value)]="oldPassword"
            [isInvalid]="isFormSubmitted() && !isOldPasswordValid()"
          >
          </app-password-input>

          <app-password-input
            label="Nueva Contraseña"
            placeholder="Mínimo 8 caracteres"
            [showMeter]="true"
            [(value)]="newPassword"
            [isInvalid]="isFormSubmitted() && !isNewPasswordValid()"
          >
          </app-password-input>

          <app-password-input
            label="Confirmar Nueva Contraseña"
            placeholder="Repite tu nueva clave"
            [(value)]="confirmPassword"
            [isInvalid]="isFormSubmitted() && !passwordsMatch()"
          >
          </app-password-input>

          @if (isFormSubmitted() && !passwordsMatch()) {
          <small class="ion-padding-start error-text">
            Las contraseñas no coinciden.
          </small>
          }

          <ion-button
            expand="block"
            type="submit"
            class="primary-btn"
            [disabled]="isFormSubmitted() && !isFormValid()"
          >
            Confirmar Cambio
          </ion-button>
        </form>
      </div>
    </div>
  </div>
</ion-content>
